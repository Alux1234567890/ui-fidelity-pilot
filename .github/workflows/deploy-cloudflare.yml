name: Deploy to Cloudflare Workers

# The build output is a Cloudflare Worker (nitro preset "cloudflare-module"), so
# this is the deploy target that matches it. The job stays skipped until the two
# Cloudflare secrets are added under Settings → Secrets and variables → Actions.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies from the committed lockfile
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy the worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'vantagetech' }}
        run: bunx wrangler deploy --name "$WORKER_NAME"

      # Optional: gives the deployed worker its own copy of the chat key, so the
      # assistant answers questions there too. Skipped when the secret is absent.
      - name: Store the chat key on the worker
        if: ${{ secrets.LOVABLE_API_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'vantagetech' }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
        run: printf '%s' "$LOVABLE_API_KEY" | bunx wrangler secret put LOVABLE_API_KEY --name "$WORKER_NAME"
