name: Deploy to Cloudflare Workers

# The build output is a Cloudflare Worker (nitro preset "cloudflare-module"), so
# this is the deploy target that matches it. The deploy job skips itself until
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist under
# Settings → Secrets and variables → Actions.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  # GitHub does not allow reading `secrets` inside a job-level `if`, so the
  # presence of each secret is worked out here and passed on as a job output.
  setup:
    runs-on: ubuntu-latest
    outputs:
      has_cf: ${{ steps.check.outputs.has_cf }}
      has_chat_key: ${{ steps.check.outputs.has_chat_key }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHAT_KEY: ${{ secrets.LOVABLE_API_KEY }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "has_cf=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cf=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$CHAT_KEY" ]; then
            echo "has_chat_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_chat_key=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: setup
    if: needs.setup.outputs.has_cf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies from the committed lockfile
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy the worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'vantagetech' }}
        run: bunx wrangler deploy --name "$WORKER_NAME"

      # Optional: gives the deployed worker its own copy of the chat key, so the
      # assistant answers questions there too. Skipped when the secret is absent.
      - name: Store the chat key on the worker
        if: needs.setup.outputs.has_chat_key == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'vantagetech' }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
        run: printf '%s' "$LOVABLE_API_KEY" | bunx wrangler secret put LOVABLE_API_KEY --name "$WORKER_NAME"
